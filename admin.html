<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Nha Trang Chung Tay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f5f5f5;padding:16px}
.box{background:#fff;padding:16px;border-radius:12px;max-width:600px;margin:0 auto}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ddd;box-sizing:border-box}
button{background:#111;color:#fff;font-weight:bold;border:0}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1}
</style>
</head>
<body>
<div class="box" id="loginBox">
<h2>Đăng nhập Admin</h2>
<input id="email" placeholder="Email Admin">
<input id="password" type="password" placeholder="Mật khẩu">
<button onclick="login()">Đăng nhập</button>
<p id="loginMsg"></p>
</div>

<div class="box" id="adminBox" style="display:none">
<h2>Sửa số điện thoại</h2>
<p>Đổi số xong bấm Lưu là web tự đổi.</p>
<div id="list"></div> <div style="border-top:1px solid #ddd;margin-top:16px;padding-top:12px">
<h3>Thêm số mới</h3>
<input id="newName" placeholder="Tên bệnh viện / đơn vị, VD: BV Da Liễu">
<input id="newPhone" placeholder="Số điện thoại, VD: 0258 123 456">
<button onclick="addPhone()">+ Thêm số mới</button>
</div>
  
<button onclick="logout()">Đăng xuất</button>
</div>

<script>
const SUPABASE_URL = "https://bpgimzfgdfiugmwvorlx.supabase.co";
const SUPABASE_KEY =  "sb_publishable_...";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function login(){ async function addPhone(){
  const name = document.getElementById('newName').value.trim();
  const phone = document.getElementById('newPhone').value.trim();
  if(!name || !phone){ alert("Bạn chưa nhập đủ tên và số!"); return; }
  const { error } = await supabaseClient.from('phone_numbers').insert([{ name: name, phone: phone }]);
  if(error){ alert("Lỗi: " + error.message); return; }
  document.getElementById('newName').value = "";
  document.getElementById('newPhone').value = "";
  alert("Đã thêm xong!");
  loadPhones();
}
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { error } = await supabase.auth.signInWithPassword({email, password});
  if(error){ document.getElementById('loginMsg').innerText = "Sai email hoặc mật khẩu!"; return; }
  loadPhones();
}
async function loadPhones(){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminBox').style.display='block';
  const { data } = await supabase.from('phone_numbers').select('*').order('id');
  document.getElementById('list').innerHTML = data.map(p=>`
    <div class="row">
      <input value="${p.name}" disabled style="background:#eee">
      <input id="phone-${p.id}" value="${p.phone}">
      <button style="width:70px" onclick="save(${p.id})">Lưu</button>
    </div>`).join('');
}
async function save(id){
  const phone = document.getElementById('phone-'+id).value;
  const { error } = await supabase.from('phone_numbers').update({phone}).eq('id', id);
  alert(error ? "Lỗi: "+error.message : "Đã lưu!");
}
async function logout(){ await supabase.auth.signOut(); location.reload(); }
</script>
</body>
</html>
